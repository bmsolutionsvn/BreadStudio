# This workflow is BreadStudio's own. OBS's inherited workflows are disabled in
# the repository's Actions settings (Actions → Workflows → Disable), never edited,
# so an upstream merge never conflicts with them; see the S0 design section 5.

name: BreadStudio

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: The fork's own checks

    # windows-2025 carries the Visual Studio 2022 the windows-x64 preset names.
    # The build job below wants the same image, once the tree can build alone.
    runs-on: windows-2025

    steps:
      - name: Check out the repository and its history
        uses: actions/checkout@v4
        with:
          # check-edits.ps1 diffs against the pinned OBS tag, so the whole
          # history and every tag must be here
          fetch-depth: 0

      # check-edits.ps1 diffs the tree against the pinned OBS tag. The fork's own
      # remote has no OBS tags, so the tag is fetched from OBS itself; a shallow
      # fetch is enough, because the diff needs the tag's tree, not its history.
      - name: Fetch the pinned OBS tag
        shell: pwsh
        run: |
          $tag = (Get-Content breadstudio/UPSTREAM-TAG -TotalCount 1).Trim()
          if (-not $tag) { throw 'breadstudio/UPSTREAM-TAG is empty' }
          if (-not (git rev-parse --verify "refs/tags/$tag" 2>$null)) {
            git fetch --depth=1 https://github.com/obsproject/obs-studio.git "refs/tags/$tag`:refs/tags/$tag"
          }
          git rev-parse --verify "refs/tags/$tag" | Out-Null
          Write-Host "pinned OBS tag $tag is present"

      # Every OBS file the fork changes outside breadstudio/ must be listed in
      # UPSTREAM-EDITS.md, and every listed file must be changed. A conflict
      # during an upstream merge should only ever be in a file on that list.
      - name: check-edits
        shell: pwsh
        run: ./breadstudio/check-edits.ps1

      - name: check-edits' own tests
        shell: pwsh
        run: ./breadstudio/check-edits.test.ps1

      - name: The packaging step's tests
        shell: pwsh
        run: ./breadstudio/packaging/Rename-Product.test.ps1

  build:
    name: Build windows-x64

    # The same image as the gates job: Visual Studio 2022 and the Windows SDK the
    # windows-x64 preset names, plus the .NET 8 SDK that libomt's native AOT
    # build needs. A full OBS build takes the better part of an hour.
    runs-on: windows-2025

    steps:
      - name: Check out the repository and its history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # breadstudio/omt-hx will not configure without a built OMT-HX checkout at
      # ../OMT-HX, and OMT-HX is its own repository. It is cloned beside this one
      # and its libomt built from the pinned upstream sources.
      - name: Check out OMT-HX beside the repository
        shell: pwsh
        run: |
          $sibling = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'OMT-HX'
          git clone --depth 1 https://github.com/bmsolutionsvn/OMT-HX $sibling
          Write-Host "OMT-HX is at $sibling"

      - name: Build libomt
        shell: pwsh
        run: |
          $sibling = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'OMT-HX'
          & (Join-Path $sibling 'scripts/build-libomt.ps1')

      # The windows-x64 preset names a generator, and the runner's Visual Studio
      # is whatever the image carries. Print it, so a failure to find one says
      # which instance was there instead of only that none matched.
      - name: Show the toolchain
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "instance: $($_.Name)" }
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -property displayName
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "windows sdk: $($_.Name)" }

      # Configures the windows-x64 preset with the pinned OBS version and
      # ENABLE_WHATSNEW=OFF, then builds it.
      - name: Configure and build
        shell: pwsh
        run: ./breadstudio/build.ps1

      - name: Upload the built program and its plugins
        uses: actions/upload-artifact@v4
        with:
          name: BreadStudio-windows-x64
          if-no-files-found: error
          path: |
            build_x64/rundir/RelWithDebInfo/bin/64bit/BreadStudio.exe
            build_x64/rundir/RelWithDebInfo/obs-plugins/64bit/**

  # The installer step of the S0 design lands with the installer itself
  # (breadstudio/installer/, an Inno Setup script, not written yet).